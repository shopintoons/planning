<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon planning de tâches</title>
<style id="css">
:root{
  --bleu:#2F6FD0; --orange:#F59A23; --vert:#2E9E4F; --rouge:#D64545;
  --jaune:#FFF2A8; --we:#F1F1F1; --ligne:#E3E3E3; --texte:#1F2430; --doux:#6B7280;
  --fond:#F7F7FA; --carte:#FFFFFF; --violet:#5B3A6B; --W:30px; --H:36px; --texteBarre:#FFFFFF;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texte);background:var(--fond);font-size:15px}
.wrap{max-width:1400px;margin:0 auto;padding:20px}
h1{margin:0 0 4px;font-size:26px;color:var(--violet)}
.sous{color:var(--doux);margin:0 0 18px}
.carte{background:var(--carte);color:var(--texte);border:1px solid var(--ligne);border-radius:12px;padding:16px;margin-bottom:16px}
.carte h2{margin:0 0 12px;font-size:17px}
.num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--violet);color:#fff;align-items:center;justify-content:center;font-size:13px;margin-right:8px}
.ligne{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--doux);font-weight:600}
input,select,button{font:inherit}
input[type=text],input[type=number],input[type=date],select{padding:8px 10px;border:1px solid #CCD0D8;border-radius:8px;background:#fff;color:var(--texte);min-height:38px}
input[type=text]{min-width:240px}
input[type=number]{width:90px}
.coche{flex-direction:row;align-items:center;gap:8px;color:var(--texte);font-weight:500;min-height:38px}
.coche input{width:18px;height:18px}
button{padding:8px 14px;border-radius:8px;border:1px solid #CCD0D8;background:#fff;cursor:pointer;min-height:38px}
button.principal{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:600}
button.petit{padding:4px 8px;min-height:30px;font-size:13px}
button:disabled{opacity:.4;cursor:default}
.info{font-size:13px;color:var(--doux);margin-top:10px}
.etat{font-size:13px;color:var(--vert);font-weight:600;min-height:18px}
.erreur{color:var(--rouge)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px;border-bottom:1px solid var(--ligne);text-align:left;font-size:14px;vertical-align:middle}
th{font-size:12px;color:var(--doux);text-transform:uppercase;letter-spacing:.03em}
td.c,th.c{text-align:center}
.pastille{display:inline-block;padding:2px 8px;border-radius:999px;color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.legende{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;font-size:13px}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i{display:inline-block;width:18px;height:12px;border-radius:3px}
.gantt{overflow-x:auto;border:1px solid var(--ligne);border-radius:8px}
.g{display:grid;position:relative;min-width:max-content;grid-template-rows:auto;grid-auto-rows:var(--H);align-items:start}
.gnom{position:sticky;left:0;background:var(--carte);z-index:3;padding:0 10px;display:flex;align-items:center;border-bottom:1px solid var(--ligne);border-right:1px solid var(--ligne);font-size:14px;font-weight:600;width:220px;height:var(--H);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtete{height:auto;min-height:52px;background:var(--fond)}
.gjours{position:relative;display:flex;border-bottom:1px solid var(--ligne);height:var(--H)}
.gjours.tete{height:auto;min-height:52px;background:var(--fond)}
.j{width:var(--W);flex:0 0 var(--W);border-left:1px solid var(--ligne);height:100%}
.j.we{background:var(--we)}
.j.auj{background:var(--jaune)}
.jt{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.25;padding:4px 0}
.jt b{font-size:12px}
.jt .m{color:var(--violet);font-weight:700;font-size:10px;height:12px}
.barre{position:absolute;top:calc(var(--H) * .17);height:calc(var(--H) * .66);border-radius:5px;color:var(--texteBarre);font-size:12px;font-weight:600;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;z-index:1}
td.poignee{cursor:grab;font-size:20px;color:#9AA0AA;user-select:none;touch-action:none;width:34px;padding:4px}
td.poignee:hover{color:var(--violet);background:#F3EEF7}
.cpoignee{cursor:grab;color:#9AA0AA;font-size:18px;padding:0 6px 0 0;margin-left:-4px;user-select:none;touch-action:none;flex:0 0 auto}
.cpoignee:hover{color:var(--violet)}
.gnom .defil{flex:1;min-width:0}
.glisse{opacity:.45}
.gnom.cible-haut::after,.gjours.cible-haut::after,.gnom.cible-bas::after,.gjours.cible-bas::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--violet);z-index:5;pointer-events:none}
.gnom.cible-haut::after,.gjours.cible-haut::after{top:0}
.gnom.cible-bas::after,.gjours.cible-bas::after{bottom:0}
body.impcal .cpoignee{display:none}
tr.glisse{opacity:.45;background:#F3EEF7}
tr.cible-haut td{box-shadow:inset 0 3px 0 var(--violet)}
tr.cible-bas td{box-shadow:inset 0 -3px 0 var(--violet)}
body.drag,body.drag *{cursor:grabbing !important;user-select:none}
.clic{cursor:pointer}
.gnom.clic:hover{color:var(--violet);background:#F3EEF7}
.gjours.clic:hover{background:rgba(91,58,107,.05)}
.barre{cursor:pointer}
.barre:hover{filter:brightness(1.1);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
#modale{position:fixed;inset:0;background:rgba(20,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modale .boite{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modale h3{margin:0 0 4px;font-size:18px;color:var(--violet)}
#modale .dates{color:var(--doux);font-size:13px;margin-bottom:14px}
#modale .champs{display:flex;flex-direction:column;gap:12px}
#modale input[type=text],#modale select{width:100%;min-width:0}
#modale .bas{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#modale .bas .droite{margin-left:auto}
#listeBox{overflow:auto;position:relative}
#listeBox thead th{position:sticky;top:0;background:var(--carte);z-index:2}
.taillebar{height:14px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;touch-action:none;border-radius:6px;margin-top:4px}
.taillebar span{width:60px;height:5px;border-radius:3px;background:#C9CCD3}
.taillebar:hover span{background:var(--violet)}
.gnom{width:var(--N,220px);overflow:hidden}
.gnom .defil{display:block;overflow-x:auto;white-space:nowrap;scrollbar-width:thin;max-width:100%;padding:4px 0}
.gnom .defil::-webkit-scrollbar{height:4px}
.gnom .defil::-webkit-scrollbar-thumb{background:#C9CCD3;border-radius:2px}
.gtete{position:sticky}
.redim{position:absolute;top:0;right:-4px;width:10px;height:100%;cursor:ew-resize;z-index:4;touch-action:none}
.redim::after{content:"";position:absolute;top:25%;bottom:25%;left:4px;width:3px;border-radius:2px;background:#C9CCD3}
.redim:hover::after{background:var(--violet)}
/* suppression : ligne en surbrillance */
tr.asupprimer td{background:#FDE2E2 !important;box-shadow:inset 0 0 0 9999px rgba(214,69,69,.10)}
tr.asupprimer td:first-child{box-shadow:inset 4px 0 0 var(--rouge)}
.gnom.asupprimer,.gjours.asupprimer{background:#FDE2E2 !important}
.gnom.asupprimer{box-shadow:inset 4px 0 0 var(--rouge)}
.gjours.asupprimer .barre{outline:2px dashed var(--rouge);outline-offset:2px}
button.danger{background:var(--rouge) !important;color:#fff !important;border-color:var(--rouge) !important;font-weight:700}
/* réglages */
.reglages{border:1px dashed #CCD0D8;border-radius:10px;padding:14px;margin:0 0 14px}
.reglages h3{margin:0 0 10px;font-size:15px}
.reglages .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 16px}
.reglages .coul{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--texte);font-weight:500;flex-direction:row}
.reglages input[type=color]{width:42px;height:32px;border:1px solid #CCD0D8;border-radius:6px;padding:2px;background:#fff;cursor:pointer}
.reglages input[type=range]{width:200px}
.reglages .val{font-weight:700;color:var(--violet);min-width:44px;display:inline-block}
/* animation tâche faite */
.confetti{position:fixed;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:100;will-change:transform,opacity;animation:conf 1.3s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.barre.bravo{animation:bravo 1.2s ease-out 1}
@keyframes bravo{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(46,158,79,.8)}30%{transform:scale(1.25)}60%{transform:scale(1);box-shadow:0 0 0 12px rgba(46,158,79,0)}100%{box-shadow:0 0 0 0 rgba(46,158,79,0)}}
tr.bravo td{animation:ligneok 1.6s ease-out 1}
@keyframes ligneok{0%{background:#C8F0D4}100%{background:transparent}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--vert);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;font-size:16px;z-index:101;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.barre.bravo,tr.bravo td{animation:none}}
.vue{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;padding:10px 12px;background:var(--fond);border-radius:10px}
.vue button.actif{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:700}
.vue .enligne{flex-direction:row;align-items:center;gap:6px;color:var(--texte);font-weight:500;font-size:14px}
.vue input[type=number]{width:70px;min-height:30px;padding:4px 8px}
.vue select,.vue input[type=date]{min-height:30px;padding:4px 8px}
tr.trprojet td{background:color-mix(in srgb,var(--pc) 14%,var(--carte));border-top:2px solid var(--pc)}
tr.trprojet b{color:var(--pc);font-size:15px}
.compte{font-size:12px;color:var(--doux);font-weight:600;margin-left:6px}
tr.trsous td.nomt{padding-left:26px;border-left:4px solid var(--pc)}
.plier{cursor:pointer;display:inline-block;width:22px;text-align:center;color:var(--pc,var(--violet));font-size:13px;user-select:none;flex:0 0 auto}
.plier:hover{transform:scale(1.25)}
.prog{display:inline-block;width:60px;height:8px;border-radius:4px;background:#E4E6EB;overflow:hidden;vertical-align:middle;margin-right:6px}
.prog i{display:block;height:100%;background:var(--vert)}
.gnom.gprojet{background:color-mix(in srgb,var(--pc) 16%,var(--carte));color:var(--pc);font-weight:800;border-top:2px solid var(--pc)}
.gjours.gprojetj{background:color-mix(in srgb,var(--pc) 6%,transparent);border-top:2px solid var(--pc)}
.gnom.sous{border-left:4px solid var(--pc);padding-left:18px;color:var(--texte);margin:0}
.barreP{border-radius:12px;font-weight:800;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.ajoutp{cursor:pointer;margin-left:4px;flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--pc);color:#fff;font-weight:700;font-size:15px}
.ajoutp:hover{filter:brightness(1.15)}
body.impcal .ajoutp,body.impcal .plier{display:none}
.vide{padding:24px;text-align:center;color:var(--doux)}
.alerte{background:#FDECEC;color:#8A1F1F;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:10px}
@page{size:landscape;margin:10mm}
body.impcal .wrap > *:not(.calcarte){display:none !important}
body.impcal .calcarte{border:none;padding:0;margin:0}
body.impcal .calcarte .info,body.impcal .calcarte h2{display:none}
body.impcal h1.titreimp{display:block !important}
body.impcal .gnom{width:170px !important;font-size:10px;height:22px}
body.impcal .gjours{height:22px}
body.impcal .gjours.tete,body.impcal .gtete{min-height:34px}
body.impcal .jt{font-size:7px;padding:2px 0}
body.impcal .jt b{font-size:8px}
body.impcal .jt .m{font-size:7px;height:9px}
body.impcal .barre{top:3px;height:16px;font-size:8px;padding:0 2px;border-radius:3px}
body.impcal .gantt{overflow:visible;border:none}
.titreimp{display:none}
@media print{ .pasimp,.carte.ajout{display:none} body{background:#fff} .gantt{overflow:visible} *{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
@media (max-width:640px){ .gnom{width:var(--N,130px)} input[type=text]{min-width:0;width:100%} label{width:100%} }
</style>

<body>
<div class="wrap" id="root"></div>
<script id="data" type="application/json">{}</script>
<script id="app">
(function(){
"use strict";
var CLE = "planning-taches";
var S;
try { S = JSON.parse(document.getElementById("data").textContent); } catch(e){ S = null; }
if(!S || !S.taches || !S.debut){ S = {debut:iso(new Date()), fin:iso(ajout(new Date(),59)), sansWE:false, taches:[]}; }
var edition = null;

/* ---------- dates ---------- */
function parse(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2],12); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function ajout(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12); return x; }
function ecart(a,b){ return Math.round((b-a)/864e5); }
function estWE(d){ var j=d.getDay(); return j===0||j===6; }
function fr(d){ return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function ouvre(d){ if(!S.sansWE) return d; while(estWE(d)) d=ajout(d,1); return d; }
function finDe(deb,jours){ var d=deb, n=1; while(n<jours){ d=ajout(d,1); if(!S.sansWE||!estWE(d)) n++; } return d; }
function apres(d){ return ouvre(ajout(d,1)); }
var MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
var JS=["D","L","M","M","J","V","S"];

/* ---------- calcul du planning ---------- */
function calcul(){
  var res={}, prec=null, deb0=ouvre(parse(S.debut));
  S.taches.forEach(function(t){
    if(estP(t)) return;
    var d;
    if(t.mode==="date" && t.date) d=ouvre(parse(t.date));
    else if(t.mode==="debut" || (!prec && t.mode==="suite")) d=deb0;
    else if(t.mode==="suite") d=apres(res[prec].fin);
    else if(t.mode==="avec" && res[t.ref]) d=res[t.ref].deb;
    else if(t.mode==="apres" && res[t.ref]) d=apres(res[t.ref].fin);
    else d= prec ? apres(res[prec].fin) : deb0;
    var j=Math.max(1,parseInt(t.jours,10)||1);
    res[t.id]={deb:d, fin:finDe(d,j)};
    prec=t.id;
  });
  var cur=null;
  S.taches.forEach(function(t){
    if(estP(t)){ res[t.id]={deb:null,fin:null,n:0,f:0}; return; }
    var r=res[t.id]; r.p = t.projet || null; cur = r.p ? res[r.p] : null;
    if(cur){ if(!cur.deb||r.deb<cur.deb) cur.deb=r.deb; if(!cur.fin||r.fin>cur.fin) cur.fin=r.fin; cur.n++; if(t.fait) cur.f++; }
  });
  S.taches.forEach(function(t){ if(estP(t)){ var g=res[t.id]; g.vide=!g.n; if(!g.deb){ g.deb=deb0; g.fin=deb0; } } });
  return res;
}
function estP(x){ return x && x.type==="projet"; }
function finBloc(i){ var x=S.taches[i]; if(!estP(x)) return i+1; var k=i+1; while(k<S.taches.length && !estP(S.taches[k]) && S.taches[k].projet===x.id) k++; return k; }
function normaliser(){
  var ids={}, cur="";
  S.taches.forEach(function(t){ if(estP(t)) ids[t.id]=1; });
  // anciennes sauvegardes : le projet se déduit de la position
  S.taches.forEach(function(t){ if(estP(t)){ cur=t.id; return; } if(t.projet===undefined) t.projet=cur; if(t.projet && !ids[t.projet]) t.projet=""; });
  // remettre chaque tâche juste sous son projet
  var enf={}, out=[];
  S.taches.forEach(function(t){ if(!estP(t) && t.projet){ (enf[t.projet]=enf[t.projet]||[]).push(t); } });
  S.taches.forEach(function(t){
    if(estP(t)){ out.push(t); (enf[t.id]||[]).forEach(function(c){ out.push(c); }); }
    else if(!t.projet) out.push(t);
  });
  S.taches=out;
}
function premierProjet(){ for(var k=0;k<S.taches.length;k++) if(estP(S.taches[k])) return k; return S.taches.length; }
function etat(t,c){
  var auj=parse(iso(new Date()));
  if(t.fait) return {txt:"Fait",col:"var(--vert)"};
  if(auj>c.fin) return {txt:"En retard",col:"var(--rouge)"};
  if(auj>=c.deb) return {txt:"En cours",col:"var(--orange)"};
  return {txt:"Prévu",col:"var(--bleu)"};
}

/* ---------- affichage ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function nomDe(id){ for(var i=0;i<S.taches.length;i++) if(S.taches[i].id===id) return S.taches[i].nom; return "?"; }

function rendu(){
  var c=calcul();
  var root=document.getElementById("root");
  var nb=S.taches.length, nbT=S.taches.filter(function(x){return !estP(x);}).length;
  var projets=S.taches.filter(estP);
  var h='';
  h+='<h1>Mon planning de tâches</h1><p class="sous">Tu mets les dates du planning, puis tes tâches avec leur nombre de jours. Le calendrier se fait tout seul. Pour changer l\'ordre, attrape une tâche par ⠿ et glisse-la.</p>';

  // 1. dates
  var fD=!!S.datesFermee;
  h+='<div class="carte"><h2 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="num">1</span>Les dates du planning'+
     (fD?' <span style="color:var(--doux);font-weight:500;font-size:14px">du '+fr(parse(S.debut))+' au '+fr(parse(S.fin))+' ('+(ecart(parse(S.debut),parse(S.fin))+1)+' jours'+(S.sansWE?', sans week-ends':'')+')</span>':'')+
     '<button id="bDates" style="margin-left:auto">'+(fD?'▼ Agrandir':'▲ Réduire')+'</button></h2><div'+(fD?' style="display:none"':'')+'><div class="ligne">'+
     '<label>Début du planning<input type="date" id="pDeb" value="'+S.debut+'"></label>'+
     '<label>Fin du planning<input type="date" id="pFin" value="'+S.fin+'"></label>'+
     '<label class="coche"><input type="checkbox" id="pWE" '+(S.sansWE?'checked':'')+'> Ne pas compter les samedis et dimanches</label>'+
     '</div><div class="info">Le planning dure <b>'+(ecart(parse(S.debut),parse(S.fin))+1)+' jours</b>.</div></div></div>';

  // 2. ajouter
  var t = edition ? S.taches.filter(function(x){return x.id===edition;})[0] : null;
  var opts='<option value="suite">Après la tâche d\'avant</option><option value="debut">Dès le début du planning</option><option value="date">À une date précise</option>';
  var avant = S.taches.slice(0, t ? S.taches.indexOf(t) : nb);
  avant.forEach(function(x){
    if(estP(x)) return;
    opts+='<option value="avec:'+x.id+'">En même temps que « '+esc(x.nom)+' »</option>';
    opts+='<option value="apres:'+x.id+'">Après « '+esc(x.nom)+' »</option>';
  });
  var fA=!!S.ajoutFermee && !t;
  h+='<div class="carte ajout"><h2 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="num">2</span>'+(t?'Modifier la tâche':'Ajouter une tâche')+
     '<button id="bAjout" style="margin-left:auto">'+(fA?'▼ Agrandir':'▲ Réduire')+'</button></h2><div'+(fA?' style="display:none"':'')+'>'+
     (t?'':'<form id="formP" class="ligne" autocomplete="off" style="padding-bottom:14px;margin-bottom:14px;border-bottom:1px dashed var(--ligne)">'+
       '<label>Nouveau projet (catégorie)<input type="text" id="pNom" maxlength="80" placeholder="Ex : Projet K41" required></label>'+
       '<label>Couleur<input type="color" id="pCoul" value="#5B3A6B" style="width:52px;height:38px;border:1px solid #CCD0D8;border-radius:8px;padding:2px"></label>'+
       '<button type="submit" class="principal">📁 Créer le projet</button></form>')+

/* ---------- actions ---------- */
function brancher(){
  var $=function(id){return document.getElementById(id);};
  $("pDeb").addEventListener("change",function(){ if(this.value){ S.debut=this.value; changer(); }});
  $("pFin").addEventListener("change",function(){ if(this.value){ S.fin=this.value; changer(); }});
  $("pWE").addEventListener("change",function(){ S.sansWE=this.checked; changer(); });
  var fP=$("formP");
  if(fP) fP.addEventListener("submit",function(ev){
    ev.preventDefault();
    var nom=$("pNom").value.trim(); if(!nom) return;
    var id="p"+Date.now().toString(36)+Math.floor(Math.random()*1e4);
    S.taches.push({id:id,type:"projet",nom:nom,couleur:$("pCoul").value,plie:false});
    S.dernierProjet=id; changer(); msg("Projet « "+nom+" » créé ✓ Ajoute maintenant ses tâches juste en dessous.");
    var n=document.getElementById("fNom"); if(n) n.focus();
  });
  var f=$("form");
  if(f) f.addEventListener("submit",function(ev){
    ev.preventDefault();
    var nom=$("fNom").value.trim(); if(!nom) return;
    var j=Math.max(1,Math.min(365,parseInt($("fJours").value,10)||1));
    var v=$("fMode").value.split(":");
    var obj={nom:nom,jours:j,mode:v[0],ref:v[1]||"",date:""};
    if(obj.mode==="date"){ obj.date=$("fDate").value; if(!obj.date){ msg("Choisis la date de début.",true); return; } }
    if(edition){ S.taches.forEach(function(x){ if(x.id===edition){ x.nom=obj.nom;x.jours=obj.jours;x.mode=obj.mode;x.ref=obj.ref;x.date=obj.date; } }); edition=null; }
    else {
      obj.id="t"+Date.now().toString(36)+Math.floor(Math.random()*1e4); obj.fait=false;
      var fp=$("fProj"), pid=fp?fp.value:"";
      if(fp){ S.dernierProjet=pid; }
      obj.projet=pid||""; S.taches.push(obj);
    }
    changer(true);
    var n=document.getElementById("fNom"); if(n) n.focus();
  });
  var an=$("fAnnul"); if(an) an.addEventListener("click",function(){ edition=null; rendu(); });
  document.querySelectorAll("[data-fait]").forEach(function(b){ b.addEventListener("change",function(){ var id=this.getAttribute("data-fait"), r=b.getBoundingClientRect(); S.taches.forEach(function(x){ if(x.id===id) x.fait=b.checked; }); changer(); if(b.checked) bravo(id,r.left+r.width/2,r.top+r.height/2); }); });
  document.querySelectorAll("[data-haut]").forEach(function(b){ b.addEventListener("click",function(){ deplacer(+this.getAttribute("data-haut"),-1); }); });
  document.querySelectorAll("[data-bas]").forEach(function(b){ b.addEventListener("click",function(){ deplacer(+this.getAttribute("data-bas"),1); }); });
  document.querySelectorAll("[data-modif]").forEach(function(b){ b.addEventListener("click",function(){ edition=this.getAttribute("data-modif"); rendu(); window.scrollTo({top:0,behavior:"smooth"}); }); });
  document.querySelectorAll("[data-suppr]").forEach(function(b){ b.addEventListener("click",function(){
    var id=this.getAttribute("data-suppr");
    if(this.getAttribute("data-ok")!=="1"){
      document.querySelectorAll('[data-suppr][data-ok="1"]').forEach(function(o){ o.removeAttribute("data-ok"); o.textContent="Supprimer"; o.classList.remove("danger"); surligner(o.getAttribute("data-suppr"),false); });
      this.setAttribute("data-ok","1"); this.textContent="Oui, supprimer"; this.classList.add("danger"); surligner(id,true);
      var me=this; setTimeout(function(){ if(me.isConnected && me.getAttribute("data-ok")==="1"){ me.removeAttribute("data-ok"); me.textContent="Supprimer"; me.classList.remove("danger"); surligner(id,false); } },5000); return; }
    S.taches=S.taches.filter(function(x){return x.id!==id;});
    S.taches.forEach(function(x){ if(x.ref===id){ x.mode="suite"; x.ref=""; } });
    if(edition===id) edition=null;
    changer();
  }); });
}
function optionsPour(t){
  var o='<option value="suite">Après la tâche d\'avant</option><option value="debut">Dès le début du planning</option><option value="date">À une date précise</option>';
  S.taches.slice(0,S.taches.indexOf(t)).forEach(function(x){
    if(estP(x)) return;
    o+='<option value="avec:'+x.id+'">En même temps que « '+esc(x.nom)+' »</option>';
    o+='<option value="apres:'+x.id+'">Après « '+esc(x.nom)+' »</option>';
  });
  return o;
}
function idsBloc(pid){ var i=-1; S.taches.forEach(function(z,k){ if(z.id===pid) i=k; }); return i<0?[]:S.taches.slice(i,finBloc(i)).map(function(z){return z.id;}); }

    '<label class="coche"><input type="checkbox" id="mPlie" '+(t.plie?'checked':'')+'> Plier le projet (cacher ses tâches)</label>'+
    '<div class="bas"><button type="submit" class="principal">Enregistrer</button><button type="button" id="mAnnul">Annuler</button></div>'+
    '<div class="bas" style="margin-top:6px;border-top:1px solid var(--ligne);padding-top:12px">'+
    '<button type="button" id="mSupT" style="color:var(--rouge)">Supprimer le projet (garder ses tâches)</button>'+
    (ids.length>1?'<button type="button" id="mSupA" style="color:var(--rouge)">Supprimer le projet ET ses '+(ids.length-1)+' tâche'+(ids.length>2?'s':'')+'</button>':'')+'</div>'+
    '</form></div>';
  document.body.appendChild(m);
  document.getElementById("mNom").focus();
  m.addEventListener("click",function(ev){ if(ev.target===m) fermerModale(); });
  document.getElementById("mAnnul").addEventListener("click",fermerModale);

function unites(niveau){ // débuts des éléments d'un même niveau
  var u=[];

  return u;

function deplacer(i,sens){
  var x=S.taches[i], u=unites(estP(x)?"":(x.projet||"")), pos=u.indexOf(i);
  if(pos<0) return;
  if(sens<0){ if(pos===0) return; deplacerVers(i,u[pos-1],true); }
  else { if(pos>=u.length-1) return; deplacerVers(i,finBloc(u[pos+1]),true); }
}
function bouger(i,j){ deplacerVers(i, j>i ? j+1 : j); }
function deplacerVers(i,T,garder){
  var x=S.taches[i]; if(!x){ rendu(); return; }
  var fin=finBloc(i), len=fin-i;
  // un projet ne peut pas couper un autre projet : se caler à la fin du bloc
  if(estP(x) && T<S.taches.length && T>0 && !estP(S.taches[T]) && S.taches[T].projet){ var q=T; while(q<S.taches.length && !estP(S.taches[q]) && S.taches[q].projet===S.taches[T].projet) q++; T=q; }
  if(T>=i && T<=fin){ rendu(); return; }
  var bloc=S.taches.splice(i,len);
  if(T>fin) T-=len;
  Array.prototype.splice.apply(S.taches,[T,0].concat(bloc));
  if(!estP(x) && !garder){
    var dessus=S.taches[T-1], dessous=S.taches[T+1];
    if(dessous && !estP(dessous) && dessous.projet) x.projet=dessous.projet;
    else if(dessus && estP(dessus)) x.projet=dessus.id;
    else if(dessus && !estP(dessus) && dessus.projet) x.projet=dessus.projet;
    else x.projet="";
  }
  normaliser();
  // une tâche ne peut dépendre que d'une tâche placée au-dessus
  var vus={};
  var change=[];
  S.taches.forEach(function(x){ if((x.mode==="avec"||x.mode==="apres") && !vus[x.ref]){ x.mode="suite"; x.ref=""; change.push(x.nom); } vus[x.id]=1; });
  changer();
  if(change.length) msg("Attention : « "+change.join(" », « ")+" » commence maintenant après la tâche d'avant (sa tâche liée est passée en dessous).", true);
}

function fenetre(){

  if(!v.n) return {d0:deb, n:ecart(deb,fin)+1, partiel:false};
  var dep = v.depart==="debut" ? deb : (v.depart==="date" && v.date ? parse(v.date) : parse(iso(new Date())));
  if(S.sansWE) while(estWE(dep)) dep=ajout(dep,1);
  // compter n jours (jours de semaine seulement si les week-ends ne comptent pas)
  var d=dep, compte=0, k=0;
  while(compte<v.n && k<400){ if(!S.sansWE || !estWE(d)) compte++; k++; d=ajout(dep,k); }
  var d0=dep<deb?deb:dep, dfin=ajout(dep,k-1); if(dfin>fin) dfin=fin;
  var n=ecart(d0,dfin)+1;
  return {d0:d0, n:n, partiel:true, vide:n<1};
}

  var o=t.closest&&t.closest("[data-ouvrir]"); if(o && !document.getElementById("modale")){ ouvrirModale(o.getAttribute("data-ouvrir")); return; }
  if(t.id==="bSauve") sauvegarder();
  else if(t.id==="bOuvrir") document.getElementById("fichier").click();
  else if(t.id==="bImprimer") window.print();
  else if(t.id==="bImpCal") imprimerCalendrier();
  else if(t.id==="bRegl"){ S.reglagesOuverts=!S.reglagesOuverts; changer(); }
  else if(t.id==="bReglFerme"){ S.reglagesOuverts=false; changer(); }
  else if(t.id==="bCoulStd"){ delete S.couleurs; changer(); }
  else if(t.id==="bTailleStd"){ delete S.largeurJour; delete S.hauteurLigne; changer(); }
  else if(t.getAttribute && t.getAttribute("data-vue")!==null){ var nv=+t.getAttribute("data-vue"); S.vue=S.vue||{}; S.vue.n=nv; changer(); }
  else if(t.id==="bDates"){ S.datesFermee=!S.datesFermee; changer(); }
  else if(t.id==="bAjout"){ S.ajoutFermee=!S.ajoutFermee; if(!S.ajoutFermee) edition=edition; changer(); }
  else if(t.id==="bListe"){ S.listeFermee=!S.listeFermee; changer(); }
  else if(t.id==="tailleAuto"){ ev.preventDefault(); delete S.hauteurListe; changer(); }
  else if(t.id==="bVider"){
    if(t.getAttribute("data-ok")!=="1"){ t.setAttribute("data-ok","1"); t.textContent="Sûr ? Clique encore"; setTimeout(function(){ if(t.isConnected){ t.removeAttribute("data-ok"); t.textContent="Tout effacer"; } },3000); return; }
    S={debut:iso(new Date()),fin:iso(ajout(new Date(),59)),sansWE:false,taches:[]}; edition=null; changer();
  }
});
document.addEventListener("change",function(ev){ if(ev.target.id==="fichier" && ev.target.files[0]){ ouvrir(ev.target.files[0]); ev.target.value=""; } });

/* ---------- démarrage ---------- */
try{ var loc=localStorage.getItem(CLE); if(loc){ var L=JSON.parse(loc); if(L&&L.taches) S=L; } }catch(e){}
normaliser();
rendu();
})();
</script>
